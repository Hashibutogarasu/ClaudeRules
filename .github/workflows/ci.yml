name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: write

jobs:
    ci:
        uses: Karasu-Lab/JsWorkflows/.github/workflows/ci.yml@main
        secrets: inherit

    release:
        needs: ci
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref_name }}
            - name: Create release tagged with the base version and commit hash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version="$(jq -r .version .claude-plugin/plugin.json)"
                  tag="v${version}-$(git rev-parse --short=7 "$GITHUB_SHA")"
                  if gh release view "$tag" > /dev/null 2>&1; then
                      echo "Release $tag already exists"
                      exit 0
                  fi
                  gh release create "$tag" \
                      --target "$GITHUB_SHA" \
                      --title "$tag" \
                      --generate-notes
